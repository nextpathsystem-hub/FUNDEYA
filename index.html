rgement...</div>:profiles.length===0?<div style={{padding:"40px 24px",textAlign:"center"}}><i className="ti ti-users-plus" style={{fontSize:40,color:C.grayT,display:"block",marginBottom:12}}/><p style={{color:C.grayT,fontSize:14,margin:"0 0 6px"}}>Pas encore d'autres étudiants</p><p style={{color:C.grayT,fontSize:12,margin:0}}>Partage Fundeya à tes collègues !</p></div>:<div style={{padding:"0 16px"}}>{top&&<div style={{background:C.navy,borderRadius:16,padding:16,marginBottom:14}}><p style={{margin:"0 0 12px",fontSize:11,fontWeight:600,color:C.orange,letterSpacing:"0.08em"}}>★ TA MEILLEURE AFFINITÉ</p><div style={{display:"flex",alignItems:"center",gap:12,marginBottom:10}}><Av name={top.name} sz={48}/><div style={{flex:1}}><p style={{margin:"0 0 2px",color:"#fff",fontWeight:600,fontSize:16}}>{top.name}</p><p style={{margin:"0 0 4px",color:"rgba(255,255,255,0.65)",fontSize:12}}>{top.level||"Étudiant·e"}</p></div><div style={{textAlign:"right"}}><p style={{margin:0,fontSize:28,fontWeight:700,color:C.orange}}>{top.affinity}%</p><p style={{margin:0,fontSize:10,color:"rgba(255,255,255,0.5)"}}>AFFINITÉ</p></div></div>{top.goals?.length>0&&<p style={{margin:"0 0 14px",fontSize:13,color:"rgba(255,255,255,0.7)"}}>{top.goals.join(" · ")}</p>}<button onClick={()=>connect(top.id)} style={{width:"100%",background:connections.includes(top.id)?C.teal:"#fff",border:"none",borderRadius:10,padding:"11px",fontSize:14,fontWeight:600,color:connections.includes(top.id)?"#fff":C.navy,cursor:"pointer"}}>{connections.includes(top.id)?"✓ Connecté·e":"Se connecter"}</button></div>}{rest.length>0&&<>{<p style={{fontSize:11,fontWeight:600,color:C.grayT,letterSpacing:"0.08em",margin:"0 0 10px"}}>AUTRES SUGGESTIONS</p>}{rest.map(u=>(<div key={u.id} style={{background:C.white,border:`1px solid ${C.grayM}`,borderRadius:14,padding:14,marginBottom:10}}><div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}><Av name={u.name} sz={40}/><div style={{flex:1}}><p style={{margin:"0 0 2px",fontWeight:500,fontSize:14,color:C.text}}>{u.name}</p><p style={{margin:0,fontSize:12,color:C.grayT}}>{u.level||"Étudiant·e"}</p></div><div style={{textAlign:"right"}}><p style={{margin:0,fontSize:18,fontWeight:700,color:C.grayT}}>{u.affinity}%</p><p style={{margin:0,fontSize:10,color:C.grayT}}>AFFINITÉ</p></div></div>{u.goals?.length>0&&<div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>{u.goals.slice(0,2).map((g,j)=><span key={j} style={{background:C.tealL,color:C.teal,fontSize:12,padding:"4px 10px",borderRadius:20,fontWeight:500}}>{g}</span>)}</div>}<button onClick={()=>connect(u.id)} style={{width:"100%",background:connections.includes(u.id)?C.teal:C.navy,border:"none",borderRadius:10,padding:"10px",fontSize:14,fontWeight:500,color:"#fff",cursor:"pointer"}}>{connections.includes(u.id)?"✓ Connecté·e":"Se connecter"}</button></div>))}</> }<div style={{height:16}}/></div>}</div>)};
const MessagesScreen=({token,userId})=>{const[convs,setConvs]=useState([]);const[open,setOpen]=useState(null);const[msgs,setMsgs]=useState([]);const[input,setInput]=useState("");const[loading,setLoading]=useState(true);const bottomRef=useRef(null);useEffect(()=>{const load=async()=>{try{const cs=await api(`connections?user_id=eq.${userId}`,{token});if(!cs?.length){setLoading(false);return}const ids=cs.map(c=>c.connected_to);const ps=await api(`profiles?id=in.(${ids.join(",")})`);setConvs(ps||[])}catch(e){console.error(e)}setLoading(false)};load()},[]);const openConv=async(p)=>{setOpen(p);try{const ms=await api(`messages?or=(and(sender_id.eq.${userId},receiver_id.eq.${p.id}),and(sender_id.eq.${p.id},receiver_id.eq.${userId}))&order=created_at.asc`,{token});setMsgs(ms||[]);setTimeout(()=>bottomRef.current?.scrollIntoView({behavior:"smooth"}),100)}catch(e){console.error(e)}};const send=async()=>{if(!input.trim()||!open)return;const text=input.trim();setInput("");const msg={sender_id:userId,receiver_id:open.id,content:text,created_at:new Date().toISOString()};setMsgs(m=>[...m,msg]);setTimeout(()=>bottomRef.current?.scrollIntoView({behavior:"smooth"}),50);try{await api("messages",{method:"POST",token,body:JSON.stringify(msg)})}catch(e){console.error(e)}};if(open)return(<div style={{display:"flex",flexDirection:"column",flex:1,overflow:"hidden"}}><div style={{padding:"14px 16px",display:"flex",alignItems:"center",gap:12,borderBottom:`1px solid ${C.grayM}`,flexShrink:0}}><button onClick={()=>setOpen(null)} style={{background:"none",border:"none",cursor:"pointer",color:C.navy,padding:0}}><i className="ti ti-arrow-left" style={{fontSize:22}}/></button><Av name={open.name} sz={38} online/><div><p style={{margin:0,fontWeight:600,fontSize:15,color:C.text}}>{open.name}</p><p style={{margin:0,fontSize:12,color:C.teal}}>{open.level||"Étudiant·e"}</p></div></div><div style={{flex:1,overflowY:"auto",padding:"16px",display:"flex",flexDirection:"column",gap:10}}>{msgs.length===0&&<div style={{textAlign:"center",padding:"30px 0",color:C.grayT,fontSize:13}}>Dis bonjour à {open.name.split(" ")[0]} 👋</div>}{msgs.map((m,i)=>(<div key={i} style={{display:"flex",justifyContent:m.sender_id===userId?"flex-end":"flex-start"}}><div style={{maxWidth:"75%",background:m.sender_id===userId?C.navy:C.gray,color:m.sender_id===userId?"#fff":C.text,borderRadius:m.sender_id===userId?"16px 16px 4px 16px":"16px 16px 16px 4px",padding:"10px 14px",fontSize:14,lineHeight:1.4}}>{m.content}</div></div>))}<div ref={bottomRef}/></div><div style={{padding:"12px 16px",borderTop:`1px solid ${C.grayM}`,display:"flex",gap:10,alignItems:"center",flexShrink:0}}><input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()} placeholder="Écrire un message..." style={{flex:1,padding:"10px 14px",borderRadius:22,border:`1px solid ${C.grayM}`,fontSize:14,background:C.gray,outline:"none"}}/><button onClick={send} style={{width:40,height:40,borderRadius:"50%",background:C.navy,border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><i className="ti ti-send" style={{color:"#fff",fontSize:16}}/></button></div></div>);return(<div style={{flex:1,overflowY:"auto"}}><div style={{padding:"20px 16px 14px"}}><h2 style={{margin:"0 0 4px",fontSize:20,fontWeight:600,color:C.text}}>Messages</h2><p style={{margin:0,fontSize:12,color:C.grayT}}>{convs.length} conversation{convs.length!==1?"s":""}</p></div>{loading?<div style={{padding:"40px",textAlign:"center",color:C.grayT}}>Chargement...</div>:convs.length===0?<div style={{padding:"40px 24px",textAlign:"center"}}><i className="ti ti-message-plus" style={{fontSize:40,color:C.grayT,display:"block",marginBottom:12}}/><p style={{color:C.grayT,fontSize:14,margin:"0 0 6px"}}>Pas encore de conversations</p><p style={{color:C.grayT,fontSize:12,margin:0}}>Connecte-toi avec des étudiants dans Découvrir</p></div>:convs.map(p=>(<button key={p.id} onClick={()=>openConv(p)} style={{width:"100%",background:"none",border:"none",cursor:"pointer",padding:"12px 16px",display:"flex",alignItems:"center",gap:12,borderBottom:`1px solid ${C.grayM}`,textAlign:"left"}}><Av name={p.name} sz={44} online/><div style={{flex:1}}><p style={{margin:"0 0 3px",fontWeight:600,fontSize:15,color:C.text}}>{p.name}</p><p style={{margin:0,fontSize:13,color:C.grayT}}>{p.level||"Étudiant·e"}</p></div><i className="ti ti-chevron-right" style={{color:C.grayT,fontSize:16}}/></button>))}</div>)};
const ProfilScreen=({token,userId,profile,onLogout})=>{const[mood,setMood]=useState(profile?.mood||"Motivé·e");const[saving,setSaving]=useState(false);const[objs,setObjs]=useState([{lb:"Réviser 1h (Pomodoro x2)",done:false},{lb:"Relire mes fiches du jour",done:false},{lb:"Faire 20 flashcards",done:false},{lb:"Message à mon binôme",done:false}]);const done=objs.filter(o=>o.done).length;const saveMood=async(m)=>{setMood(m);setSaving(true);try{await api(`profiles?id=eq.${userId}`,{method:"PATCH",token,body:JSON.stringify({mood:m})})}catch(e){console.error(e)}setSaving(false)};return(<div style={{overflowY:"auto",flex:1}}><div style={{padding:"20px 16px",display:"flex",alignItems:"center",gap:14}}><Av name={profile?.name||"?"} sz={62}/><div style={{flex:1}}><h2 style={{margin:"0 0 2px",fontSize:20,fontWeight:600,color:C.text}}>{profile?.name||"Mon profil"}</h2><p style={{margin:"0 0 2px",fontSize:13,color:C.teal,fontWeight:500}}>{profile?.level||"Étudiant·e"}</p><p style={{margin:0,fontSize:12,color:C.grayT}}>{profile?.university||"Nantes Université"}</p></div><button onClick={onLogout} style={{width:36,height:36,borderRadius:"50%",background:C.gray,border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><i className="ti ti-logout" style={{fontSize:16,color:C.textS}}/></button></div>{profile?.goals?.length>0&&<div style={{padding:"0 16px",marginBottom:16}}><div style={{display:"flex",flexWrap:"wrap",gap:6}}>{profile.goals.map((g,i)=><span key={i} style={{background:C.tealL,color:C.teal,fontSize:12,padding:"5px 12px",borderRadius:20,fontWeight:500}}>{g}</span>)}</div></div>}<div style={{padding:"0 16px",marginBottom:14}}><div style={{background:C.white,border:`1px solid ${C.grayM}`,borderRadius:14,padding:14,marginBottom:10}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}><p style={{margin:0,fontWeight:500,fontSize:14,color:C.text}}>Mon humeur {saving&&<span style={{fontSize:11,color:C.grayT}}>· sauvegarde...</span>}</p><span style={{background:(MOODS[mood]||C.navy)+"20",color:MOODS[mood]||C.navy,fontSize:12,fontWeight:600,padding:"3px 10px",borderRadius:20}}>● {mood}</span></div><div style={{display:"flex",flexWrap:"wrap",gap:7}}>{Object.entries(MOODS).map(([m,col])=>(<button key={m} onClick={()=>saveMood(m)} style={{background:mood===m?col:"none",color:mood===m?"#fff":C.textS,border:`1.5px solid ${mood===m?col:C.grayM}`,borderRadius:20,padding:"5px 12px",fontSize:12,cursor:"pointer",display:"flex",alignItems:"center",gap:5}}><span style={{width:7,height:7,borderRadius:"50%",background:mood===m?"#fff":col,display:"inline-block"}}/>{m}</button>))}</div>{profile?.bio&&<div style={{marginTop:12,background:C.gray,borderRadius:8,padding:"9px 12px",fontSize:13,color:C.textS}}>{profile.bio}</div>}</div><div style={{background:C.orangeL,border:"1px solid #F5D5A8",borderRadius:14,padding:14}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}><p style={{margin:0,fontWeight:600,fontSize:14,color:"#B86A10"}}>Objectifs du jour</p><span style={{fontSize:13,fontWeight:600,color:"#B86A10"}}>{done}/4</span></div><div style={{background:C.grayM,borderRadius:4,height:6,marginBottom:12}}><div style={{height:6,borderRadius:4,background:C.orange,width:`${(done/4)*100}%`,transition:"width 0.3s"}}/></div>{objs.map((o,i)=>(<button key={i} onClick={()=>setObjs(os=>os.map((ob,j)=>j===i?{...ob,done:!ob.done}:ob))} style={{width:"100%",display:"flex",alignItems:"center",gap:10,background:"none",border:"none",cursor:"pointer",padding:"7px 0",textAlign:"left"}}><div style={{width:20,height:20,borderRadius:6,border:`2px solid ${o.done?C.orange:C.grayM}`,background:o.done?C.orange:"none",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>{o.done&&<i className="ti ti-check" style={{fontSize:12,color:"#fff"}}/>}</div><span style={{fontSize:13,color:o.done?C.grayT:C.text,textDecoration:o.done?"line-through":"none"}}>{o.lb}</span></button>))}</div></div></div>)};
function App(){const[token,setToken]=useState(null);const[user,setUser]=useState(null);const[profile,setProfile]=useState(null);const[screen,setScreen]=useState("auth");const[active,setActive]=useState("accueil");const onAuth=async(tk,u,nameHint)=>{setToken(tk);setUser(u);try{const ps=await api(`profiles?id=eq.${u.id}`,{token:tk});if(ps?.length&&ps[0].level){setProfile(ps[0]);setScreen("app")}else{setProfile(ps?.[0]||{id:u.id,name:nameHint||u.email});setScreen("onboarding")}}catch(e){setScreen("onboarding")}};const onOnboardingDone=async()=>{try{const ps=await api(`profiles?id=eq.${user.id}`,{token});setProfile(ps?.[0])}catch(e){}setScreen("app")};const logout=()=>{setToken(null);setUser(null);setProfile(null);setScreen("auth");setActive("accueil")};const appScreens={accueil:<Accueil profile={profile}/>,decouvrir:<Decouvrir token={token} userId={user?.id}/>,messages:<MessagesScreen token={token} userId={user?.id}/>,profil:<ProfilScreen token={token} userId={user?.id} profile={profile} onLogout={logout}/>};return(<div style={{display:"flex",justifyContent:"center",alignItems:"center",minHeight:"100vh",background:"#E8EAF0",padding:"20px 0"}}><div style={{width:375,height:780,background:C.white,borderRadius:40,overflow:"hidden",display:"flex",flexDirection:"column",boxShadow:"0 20px 60px rgba(0,0,0,0.18)"}}><div style={{background:C.white,padding:"14px 20px 0",display:"flex",justifyContent:"space-between",alignItems:"center",flexShrink:0}}><span style={{fontSize:13,fontWeight:500,color:C.text}}>9:41</span><div style={{width:60,height:20,background:C.text,borderRadius:10}}/><div style={{display:"flex",gap:5,alignItems:"center"}}><i className="ti ti-wifi" style={{fontSize:14,color:C.text}}/><i className="ti ti-battery-2" style={{fontSize:16,color:C.text}}/></div></div><div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>{screen==="auth"&&<AuthScreen onAuth={onAuth}/>}{screen==="onboarding"&&<OnboardingScreen token={token} userId={user?.id} name={profile?.name} onDone={onOnboardingDone}/>}{screen==="app"&&appScreens[active]}</div>{screen==="app"&&<Nav active={active} set={setActive}/>}</div></div>)}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
